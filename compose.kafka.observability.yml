# Include after compose.kafka.yml and compose.observability.yml.
services:
  worker:
    environment:
      JAVA_TOOL_OPTIONS: -Xmx384m -javaagent:/otel/opentelemetry-javaagent.jar
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-local}
      OTEL_SERVICE_NAME: codepath-academy-worker
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=${DEPLOYMENT_ENVIRONMENT:-local},service.version=${APP_VERSION:-local}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: otlp
      OTEL_INSTRUMENTATION_JDBC_STATEMENT_SANITIZER_ENABLED: 'true'
      OTEL_INSTRUMENTATION_LOGBACK_APPENDER_EXPERIMENTAL_CAPTURE_LOGGER_CONTEXT_ATTRIBUTES: 'false'
    networks:
      observability:
        aliases: ["codepath-worker-${DEPLOYMENT_ENVIRONMENT:-local}"]
