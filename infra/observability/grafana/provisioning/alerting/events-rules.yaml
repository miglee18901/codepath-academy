          },
          "labels": {
            "severity": "warning",
            "service": "codepath-academy"
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "count by(deployment)(codepath_events_email_failed{job=\"codepath-worker\"} > 0)",
                "instant": true,
                "range": false,
                "intervalMs": 15000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "B",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "type": "query",
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0
                      ]
                    },
                    "operator": {
                      "type": "and"
                    },
                    "reducer": {
                      "type": "last",
                      "params": []
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "codepath-events-lag",
          "title": "Kafka consumer lag is not decreasing",
          "condition": "B",
          "for": "5m",
          "noDataState": "OK",
          "execErrState": "Alerting",
          "annotations": {
            "summary": "Kafka consumer lag is not decreasing",
            "description": "Open Admin → Sự kiện. Check worker/Kafka health and retry failed events or email jobs.",
            "runbook_url": "https://github.com/miglee18901/codepath-academy/blob/main/infra/kafka/README.md"
          },
          "labels": {
