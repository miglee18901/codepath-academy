            },
            {
              "refId": "B",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "type": "query",
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0
                      ]
                    },
                    "operator": {
                      "type": "and"
                    },
                    "reducer": {
                      "type": "last",
                      "params": []
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "codepath-events-broker",
          "title": "Kafka broker unreachable",
          "condition": "B",
          "for": "2m",
          "noDataState": "OK",
          "execErrState": "Alerting",
          "annotations": {
            "summary": "Kafka broker unreachable",
            "description": "Open Admin → Sự kiện. Check worker/Kafka health and retry failed events or email jobs.",
            "runbook_url": "https://github.com/miglee18901/codepath-academy/blob/main/infra/kafka/README.md"
          },
          "labels": {
