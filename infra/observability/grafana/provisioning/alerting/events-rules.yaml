              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "count by(deployment)((codepath_events_consumer_lag{job=\"codepath-worker\"} > 0) and (delta(codepath_events_consumer_lag{job=\"codepath-worker\"}[5m]) >= 0))",
                "instant": true,
                "range": false,
                "intervalMs": 15000,
                "maxDataPoints": 43200
