              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "count by(deployment)(codepath_events_broker_available{job=\"codepath-worker\"} == 0)",
                "instant": true,
                "range": false,
                "intervalMs": 15000,
