        {
          "uid": "codepath-events-consumers",
          "title": "Kafka consumer stopped",
          "condition": "B",
          "for": "2m",
          "noDataState": "OK",
          "execErrState": "Alerting",
          "annotations": {
            "summary": "Kafka consumer stopped",
            "description": "Open Admin → Sự kiện. Check worker/Kafka health and retry failed events or email jobs.",
