apiVersion: 1
contactPoints:
  - orgId: 1
    name: operations-email
    receivers:
      - uid: operations-email
        type: email
        settings:
          addresses: $ALERT_EMAIL
          singleEmail: true
        disableResolveMessage: false
policies:
  - orgId: 1
    receiver: operations-email
    group_by: [grafana_folder, alertname, deployment]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
