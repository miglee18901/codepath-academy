receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  transform/privacy:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - delete_matching_keys(attributes, "(?i)^(url\\.(full|query)|http\\.(url|target|request\\.header\\..*|response\\.header\\..*)|db\\.(statement|query\\.text)|enduser\\..*|user\\..*|messaging\\.message\\.body|exception\\.(message|stacktrace))$")
      - context: spanevent
        statements:
          - delete_matching_keys(attributes, "(?i)^(exception\\.(message|stacktrace)|.*(password|authorization|cookie|token|secret).*)$")
    log_statements:
      - context: log
        statements:
          - delete_matching_keys(attributes, "(?i)^(exception\\.(message|stacktrace)|.*(password|authorization|cookie|token|secret).*)$")
          - replace_pattern(body, "(?i)(Bearer )[A-Za-z0-9._~+/-]+=*", "$$1[REDACTED]") where IsString(body)
          - replace_pattern(body, "(?i)((?:password|secret|access_token|refresh_token|id_token|code|otp)[=:]\\s*)[^\\s&,;]+", "$$1[REDACTED]") where IsString(body)
  batch:
    timeout: 5s
    send_batch_size: 512
exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    sending_queue:
      queue_size: 256
    retry_on_failure:
      max_elapsed_time: 60s
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    sending_queue:
      queue_size: 256
    retry_on_failure:
      max_elapsed_time: 60s
service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/privacy, batch]
      exporters: [otlp/tempo]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, transform/privacy, batch]
      exporters: [otlphttp/loki]
