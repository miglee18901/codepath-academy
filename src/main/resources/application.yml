spring:
  application:
    name: codepath-academy
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/academy_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:academy}
    password: ${DB_PASSWORD:academy_local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  artemis:
    mode: embedded
    embedded:
      enabled: true
      queues: emailQueue
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
jwt:
  secret: ${JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
  expiration: 900000
  refresh:
    expiration: 604800000
client:
  id: ${PAYOS_CLIENT_ID:local-placeholder}
api:
  key: ${PAYOS_API_KEY:local-placeholder}
checksum:
  key: ${PAYOS_CHECKSUM_KEY:local-placeholder}
google:
  recaptcha:
    secret-key: ${RECAPTCHA_SECRET_KEY:6LeIxAcTAAAAAGG-vFI1TnRWxMZNFuojJ4WifJWe}
mux:
  token-id: ${MUX_TOKEN_ID:}
  token-secret: ${MUX_TOKEN_SECRET:}
  signing-key-id: ${MUX_SIGNING_KEY_ID:}
  signing-private-key: ${MUX_SIGNING_PRIVATE_KEY:}
app:
  ai:
    search-enabled: ${AI_SEARCH_ENABLED:false}
    assistant-enabled: ${AI_ASSISTANT_ENABLED:false}
    indexing-enabled: ${AI_INDEXING_ENABLED:false}
    ollama-url: ${AI_OLLAMA_URL:http://localhost:11434}
    qdrant-url: ${AI_QDRANT_URL:http://localhost:6333}
    qdrant-api-key: ${AI_QDRANT_API_KEY:}
    collection: ${AI_COLLECTION:codepath_local_v1}
    embedding-model: ${AI_EMBEDDING_MODEL:embeddinggemma:300m}
    chat-model: ${AI_CHAT_MODEL:qwen3:4b-instruct-2507-q4_K_M}
    dimensions: ${AI_EMBEDDING_DIMENSIONS:768}
    min-score: ${AI_MIN_SCORE:0.35}
    num-threads: ${AI_NUM_THREADS:3}
  oauth:
    callback-base-url: ${OAUTH_CALLBACK_BASE_URL:}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
  passkeys:
    rp-id: ${PASSKEY_RP_ID:}
    origins: ${PASSKEY_ORIGINS:}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  mail-from: ${MAIL_FROM:no-reply@codepath.local}
  demo-data: ${DEMO_DATA:false}

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${OAUTH_COOKIE_SECURE:false}

# Docker-only management port; never published or proxied by the frontend.
management:
  server:
    port: 9091
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: codepath-academy-backend
      environment: ${DEPLOYMENT_ENVIRONMENT:local}
      version: ${APP_VERSION:local}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    enabled: false

logging:
  pattern:
    level: '%5p [trace_id=%X{trace_id:-} span_id=%X{span_id:-}]'
